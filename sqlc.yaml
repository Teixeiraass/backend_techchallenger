version: "2"

sql:
  - engine: "postgresql"
    schema: "./db/migration/"
    queries: "./db/query/"
    gen:
      go:
        package: "db"
        out: "./db/sqlc"
        emit_prepared_queries: false
        emit_interface: true
        emit_exact_table_names: false
        emit_json_tags: true
        emit_empty_slices: true
        rename:
          sesso: "Sessao"
          ordens_servico: "OrdemServico"
          reparos_adicionai: "ReparoAdicional"
          historico_status_o: "HistoricoStatusOS"
          itens_servico: "ItemServico"
          itens_peca: "ItemPeca"
          movimentos_estoque: "MovimentoEstoque"
