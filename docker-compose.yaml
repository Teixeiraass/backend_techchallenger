# Ambiente completo para desenvolvimento local e avaliação: PostgreSQL + API.
# As credenciais abaixo existem só para este ambiente local descartável.
services:
  postgres:
    image: postgres:16.13-alpine
    environment:
      - POSTGRES_USER=root
      - POSTGRES_PASSWORD=secret
      - POSTGRES_DB=oficina
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d oficina"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      - DB_DRIVER=postgres
      - DB_SOURCE=postgresql://root:secret@postgres:5432/oficina?sslmode=disable
      - SERVER_ADDRESS=0.0.0.0:8080
      - TOKEN_TYPE=${TOKEN_TYPE:-paseto}
      - TOKEN_SYMMETRIC_KEY=${TOKEN_SYMMETRIC_KEY:-dev-only-change-me-0123456789abc}
      - ACCESS_TOKEN_DURATION=15m
      - REFRESH_TOKEN_DURATION=24h
      - ADMIN_NOTIFICATION_TO=admin@oficina.com
      - GIN_MODE=release
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/app/wait-for.sh", "postgres:5432", "--", "/app/start.sh"]
    command: ["/app/main"]

volumes:
  postgres-data:
